<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>scn3 Disk Sunburst</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="group">
        <button id="up" class="tool" title="Up to the parent folder (Backspace)" aria-label="Up"></button>
        <button id="back" class="tool" title="Back (Alt+Left)" aria-label="Back"></button>
        <button id="rescan" class="tool" title="Rescan this folder (F5)" aria-label="Rescan"></button>
        <button id="cancel" class="tool danger" title="Cancel the scan" aria-label="Cancel scan" hidden></button>
      </div>
      <nav id="crumbs" aria-label="Path"></nav>
      <button id="labels" class="tool" aria-pressed="true" title="Show names in the chart"></button>
      <button id="colors" class="tool" aria-pressed="false" title="Color by age: oldest to newest change"></button>
      <div class="theme">
        <button id="theme" class="tool" aria-haspopup="menu" aria-expanded="false" title="Theme"></button>
        <div id="theme-menu" class="popover" role="menu" hidden>
          <button role="menuitemradio" data-theme="system">System</button>
          <button role="menuitemradio" data-theme="light">Light</button>
          <button role="menuitemradio" data-theme="dark">Dark</button>
          <button role="menuitemradio" data-theme="contrast">High contrast</button>
        </div>
      </div>
    </header>
    <main>
      <aside>
        <h2>Drives</h2>
        <ul id="volumes"></ul>
        <button id="folder" class="wide"></button>
        <label class="switch" title="Also list disk images, system volumes, and boot and container mounts">
          <input type="checkbox" id="show-all" role="switch" />
          <span>Show all drives</span>
        </label>
      </aside>
      <section id="stage">
        <div id="info" aria-live="polite"></div>
        <div id="area">
          <div id="progress" hidden>
            <div id="progress-text"></div>
            <div class="bar"><div id="progress-bar"></div></div>
          </div>
          <div id="denied" hidden>
            <button id="denied-close" class="close" aria-label="Dismiss" title="Dismiss"></button>
            <span id="denied-text"></span>
            <button id="privacy" hidden>Open Full Disk Access settings</button>
          </div>
          <canvas id="chart"></canvas>
          <div id="legend" hidden>
            <span>Older</span><div class="ramp"></div><span>Newer</span>
            <small>compared within each folder</small>
          </div>
          <p id="empty">Pick a drive or a folder to scan.</p>
        </div>
      </section>
    </main>
    <div id="menu" class="popover" role="menu" hidden></div>
    <div id="toast" role="alert" hidden></div>
    <dialog id="confirm">
      <p id="confirm-text"></p>
      <form method="dialog">
        <button value="cancel">Cancel</button>
        <button value="ok" id="confirm-ok">Move to Trash</button>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
